apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: service-account-patch.yaml
  - target:
      kind: Deployment
      name: jlapp-producao-deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SPRING_PROFILES_ACTIVE
          value: dev
  - target:
      kind: Deployment
      name: jlapp-producao-deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: jlapp-producao-deployment
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: Deployment
      name: jlapp-producao-deployment
    patch: |-
      - op: replace
        path: /spec/strategy/rollingUpdate/maxSurge
        value: 0
      - op: replace
        path: /spec/strategy/rollingUpdate/maxUnavailable
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            cpu: 1000m
            memory: 640Mi
  - target:
      kind: Deployment
      name: jlapp-producao-deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: jlapp-producao-deployment
      spec:
        template:
          spec:
            containers:
              - name: jlapp-producao
                env:
                  - name: SPRING_JPA_HIBERNATE_DDL_AUTO
                    value: update
                  - name: SPRING_RABBITMQ_SSL_ENABLED
                    value: "false"
